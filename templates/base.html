<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.APP_NAME }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  {% if current_user.is_authenticated %}
  <nav class="navbar navbar-expand-md navbar-light bg-light border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">{{ config.APP_NAME }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Grocery</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="{{ url_for('grocery.index') }}">Manage List</a></li>
              <li><a class="dropdown-item" href="{{ url_for('grocery.shop') }}">Shop</a></li>
            </ul>
          </li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item d-flex align-items-center gap-2 me-2">
            {% if current_user.profile_picture_url %}
            <img src="{{ current_user.profile_picture_url }}" class="rounded-circle" width="32" height="32" alt="{{ current_user.name }}">
            {% endif %}
            <span class="nav-link disabled">{{ current_user.name }}</span>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('auth.logout') }}">Sign out</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  {% endif %}
  <main class="container mt-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
